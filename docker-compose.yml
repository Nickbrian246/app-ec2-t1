services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-ec2-t1:latest
    container_name: app-ec2-t1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - web

networks:
  web:
    name: my-web
